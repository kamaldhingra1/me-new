# Sample workflow for building and deploying an Astro site with Pagefind to GitHub Pages
name: Deploy Astro site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "." # default value when not using subfolders

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9  # Update this to your project's specific pnpm version if needed
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Reverted to standard stable LTS Node 20 as requested 
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml" # Glob path pattern resolves caching bugs
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.BUILD_PATH }}
        
      # Triggers your package.json build script natively via pnpm
      - name: Build with Astro and Pagefind
        run: pnpm build
        working-directory: ${{ env.BUILD_PATH }}
        
      # Uploads the entire compiled dist folder
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
